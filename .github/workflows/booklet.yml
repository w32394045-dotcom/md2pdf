name: booklet

on:
  push:
    paths:
      - 'booklet/**'
      - '.github/workflows/booklet.yml'
  pull_request:
    paths:
      - 'booklet/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate booklet single-file build
        run: node booklet/check.cjs

